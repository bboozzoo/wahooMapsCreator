name: wahoomc
title: wahooMapsCreator
version: 4.4.0
summary: Create up-to-date maps for your Wahoo device based on latest OSM data
website: https://github.com/treee111/wahooMapsCreator
description: |
  Downloads OpenStreetMap data, processes it (optionally with GDAL contour
  lines), and writes .map files for Wahoo BOLT / ROAM / ELEMNT GPS computers.
  Ships a CLI and a GUI (tkinter/matplotlib).
license: MIT
contact: https://github.com/treee111/wahooMapsCreator
issues: https://github.com/treee111/wahooMapsCreator/issues
source-code: https://github.com/treee111/wahooMapsCreator

base: core26
confinement: strict
grade: stable

# ---- Parts ---------------------------------------------------------------

parts:
  wahoomc:
    plugin: python
    source: .
    python-packages:
      - "geojson"
      - "GDAL==3.12.2"
      - "beautifulsoup4"
      - "lxml"
      - "matplotlib"
      - "packaging"
      - "shapely"
      - "requests"
    build-packages:
      - python3-dev
      - python3-venv
      - python3-pip
      - gdal-bin
      - libgdal-dev
      - libgeos-dev
      - libproj-dev
      - build-essential
      - pkg-config
    stage-packages:
      - python3.14
      - python3.14-tk
      - python3-venv
      - openjdk-26-jre
      - openjdk-26-jre-headless

# ---- Apps ----------------------------------------------------------------

apps:
  wahoomc:
    command: bin/python -m wahoomc cli --
    plugs:
      - network
      - home
      - removable-media
      - opengl

  wahoomc-gui:
    command: bin/python -m wahoomc gui
    plugs:
      - network
      - home
      - removable-media
      - opengl
      - wayland
      - x11
      - browser-support
